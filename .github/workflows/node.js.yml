name: Build and Deploy

on:
  push:
    branches: [ "New-Design" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 0xD3C0D3/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./0xD3C0D3

      - name: Build
        run: npm run build
        working-directory: ./0xD3C0D3

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: 0xD3C0D3/dist
          branch: gh-pages
